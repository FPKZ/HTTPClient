<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Auth - Sincronizando</title>
    <style>
      :root {
        --bg-dark: #0f0f0f;
        --bg-panel: #181818;
        --volt-yellow: #f59e0b;
        --text-main: #e2e8f0;
        --text-dim: #94a3b8;
        --border: #2d2d2d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2.5rem;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        max-width: 500px;
        width: 90%;
        position: relative;
      }

      .logo-icon {
        color: var(--volt-yellow);
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
      }

      .icon-box {
        width: 96px;
        height: 96px;
        background: #1E1E1E;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border: 1px solid #333;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
      }

      p {
        color: var(--text-dim);
        font-size: 0.875rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }

      .loader-container {
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
      }

      .loader-bar {
        width: 30%;
        height: 100%;
        background: var(--volt-yellow);
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }

      .status-tag {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 4px;
        background: #1e293b;
        color: var(--volt-yellow);
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="container" id="card">
      <div class="logo-icon">
        <div class="icon-box">
          <svg width="48" height="48" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10L15 45H35L25 70L55 30H35L40 10Z" fill="#FFC107" />
          </svg>
        </div>
      </div>
      <h1 id="title">Login em processamento...</h1>
      <p id="desc">O <strong>Volt API Client</strong> está sincronizando sua conta com segurança. Esta janela fechará em instantes.</p>

      <div class="loader-container" id="loader">
        <div class="loader-bar"></div>
      </div>

      <div class="status-tag">Status: Handshaking</div>
    </div>

    <script>
      const hash = window.location.hash;
      if (hash) {
        fetch('/capture' + window.location.search + hash.replace('#', '?'))
          .then(() => {
            document.getElementById('title').innerText = 'Autenticado!';
            document.getElementById('desc').innerHTML = 'Sincronização concluída. Você já pode voltar para o <strong>Volt</strong>.';
            document.getElementById('loader').style.display = 'none';
            document.querySelector('.status-tag').innerText = 'Status: Success';
            document.querySelector('.status-tag').style.color = '#10b981';
            setTimeout(() => window.close(), 2500);
          })
          .catch(err => {
            document.getElementById('title').innerText = 'Ops, erro na captura';
            document.getElementById('desc').innerText = 'Não foi possível comunicar com o app desktop.';
          });
      }
    </script>
  </body>
</html>
